[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabpfn-lab"
version = "0.1.0"
description = "Sandbox for exploring TabPFN and benchmarking custom preprocessing."
requires-python = ">=3.10"
dependencies = [
    "tabpfn>=9.0",
    "torch",
    "scikit-learn",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "model: needs TabPFN weights (skipped when they can't be loaded)",
]
