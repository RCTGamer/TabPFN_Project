# Cluster experts with a gate fitted on held-out training rows, against the untuned gate and the random baseline.
#   python -m tabpfn_lab.cli coreset --config configs/perest_gate.yaml
#   python -m tabpfn_lab.cli analyze --csv results/tables/perest_gate.csv
#   grep "gate fit" results/logs/perest_gate.log      # fitted temperature, held-out losses, nearest_is_best
# cluster_experts_tuned keeps a slice of the training rows (val_fraction, at most val_max rows) out of every
# expert's context and fits the gate on it (training labels only; not transductive). Rows it writes:
#   cluster_experts_tuned            fitted temperature
#   cluster_experts_tuned+bias       fitted temperature and a per-expert offset
#   cluster_experts_tuned+heuristic  same experts, untuned gate: what the smaller context pool costs by itself
# It costs a second fit of the same experts, to predict the held-out rows (n_fits = 2 in the timing CSV).
name: perest_gate
backend: {name: tabpfn, version: "3.5", device: cuda, fit_mode: fit_preprocessors}
datasets:
  dev:
    - {name: electricity, source: openml, data_id: 151, task: classification}   # n_train ~32k, 8 features
    - {name: houses, source: openml, data_id: 537, task: regression}            # n_train ~14k, 8 features
    - {name: phoneme, source: openml, data_id: 1489, task: classification}      # n_train ~3.8k, 5 features
  confirm: []
test_size: 0.3
n_estimators: 8
aggregator: mean
budget_fractions: []
budget_absolute: [1024]          # rows per estimator
coreset_methods: [perest_random, cluster_experts, cluster_experts_tuned]
coreset_kwargs:
  cluster_experts_tuned: {val_fraction: 0.2, val_max: 2000}
perest_mode: single_fit
baseline: perest_random
combined_aggregators: []
split_seeds: 3
selection_seeds: 3
cache_dir: null
log_dir: results/logs
out_csv: results/tables/perest_gate.csv
