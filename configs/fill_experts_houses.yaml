# The local experts of perest_experts_large.yaml on houses, the one small dataset where they were never run.
# phoneme is left out: with 3,782 training rows every variant falls back to 8 clusters, the same as
# cluster_experts_tuned, which already ran there.
#   python -m tabpfn_lab.cli coreset --config configs/fill_experts_houses.yaml
#   python -m tabpfn_lab.cli analyze --csv results/tables/fill_experts_houses.csv
# Same split seeds and one selection seed, as in perest_experts_large.yaml. About 14 clusters (28 with overlap).
name: fill_experts_houses
backend: {name: tabpfn, version: "3.5", device: cuda, fit_mode: fit_preprocessors}
datasets:
  dev:
    - {name: houses, source: openml, data_id: 537, task: regression}
  confirm: []
test_size: 0.3
n_estimators: 8
aggregator: mean
budget_fractions: []
budget_absolute: [1024]          # rows per expert
coreset_methods: [perest_random, cluster_experts_tuned, experts_scaled, experts_weighted, experts_overlap, experts_full]
coreset_kwargs:
  cluster_experts_tuned: {val_fraction: 0.2, val_max: 2000}
  experts_scaled: {val_fraction: 0.2, val_max: 2000, max_clusters: 128}
  experts_weighted: {val_fraction: 0.2, val_max: 2000, max_clusters: 128}
  experts_overlap: {val_fraction: 0.2, val_max: 2000, max_clusters: 128}
  experts_full: {val_fraction: 0.2, val_max: 2000, max_clusters: 128}
perest_mode: single_fit
baseline: perest_random
combined_aggregators: []
split_seeds: 3
selection_seeds: 1
cache_dir: null
log_dir: results/logs
out_csv: results/tables/fill_experts_houses.csv
